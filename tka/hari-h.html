<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulasi Hari H TKA SD · Dua Sesi Berturut-turut</title>
<meta name="description" content="Latihan seperti hari TKA SD: Bahasa Indonesia dan Matematika dua sesi berturut-turut dengan istirahat, nilai ditampilkan setelah kedua sesi selesai.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root{--biru:#12314f;--biru2:#1f4f7a;--aksen:#1f6fb2;--kuning:#ffd21f;--hijau:#1b7f3e;--merah:#c0392b;--ink:#16202a;--muted:#5b6b7f;--line:#dfe5ec;--latar:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;background:var(--latar);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
[hidden]{display:none!important}
a{color:var(--aksen)}
.bar{background:linear-gradient(90deg,var(--biru),var(--biru2));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}
.bar a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:800}
.bar img{width:30px;height:30px}.bar small{display:block;color:var(--kuning);font-size:11px;letter-spacing:.06em}
.wadah{max-width:760px;margin:20px auto 60px;padding:0 14px}
.kartu{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 8px 22px rgba(18,49,79,.05)}
h1{margin:0 0 6px;color:var(--biru);font-size:24px}h2{margin:0 0 8px;color:var(--biru);font-size:19px}
.sub{color:var(--muted);margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;font-size:15px;background:var(--biru);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.kuning{background:var(--kuning);color:var(--biru)}.btn.ghost{background:#fff;color:var(--biru);border:1px solid var(--line)}.btn.wa{background:#25d366}.btn.kecil{padding:8px 12px;font-size:13.5px}
.langkah{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 16px;counter-reset:l}
.langkah div{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.langkah div b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:#e6ebf2;color:var(--muted);font-size:15px}
.langkah div.ok b{background:var(--hijau);color:#fff}.langkah div.kini b{background:var(--kuning);color:var(--biru);box-shadow:0 0 0 4px #fff3b0}.langkah div.kini{color:var(--biru)}
.jadwal{display:grid;gap:8px;margin:8px 0 14px}
.jadwal div{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.jadwal div>span:first-child{font-size:26px;flex:none;width:34px;text-align:center}.jadwal b{display:block}.jadwal small{color:var(--muted)}
.pilih{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.pilih label{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.pilih label:has(input:checked){border-color:var(--aksen);background:#eef6ff}
.pilih small{display:block;color:var(--muted)}
.cek{display:grid;gap:6px;margin:6px 0 14px}.cek label{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.waktu{font-size:56px;font-weight:900;color:var(--biru);text-align:center;letter-spacing:.04em;margin:6px 0}
.tips{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:12px 14px;margin:10px 0}
.tips ul,.saran ul{margin:6px 0;padding-left:20px}
.nilai{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.nilai div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.nilai b{display:block;font-size:34px;color:var(--biru);line-height:1.1}.nilai small{color:var(--muted);font-size:13px}
.pred{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:800;margin-top:4px}
.p4{background:#dcfce7;color:#166534}.p3{background:#e0f2fe;color:#075985}.p2{background:#fef3c7;color:#92400e}.p1{background:#fee2e2;color:#991b1b}
.saran a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0;text-decoration:none;color:inherit;background:#fff}
.baris{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.catatan{font-size:13px;color:var(--muted)}
@media(max-width:560px){.pilih,.nilai{grid-template-columns:1fr}.waktu{font-size:46px}.langkah div{font-size:10.5px}}
</style>
</head>
<body>
<header class="bar"><a href="./"><img src="logo.svg" alt=""><span><small>SIMULASI TKA SD</small>Simulasi Hari H</span></a></header>
<main class="wadah">
  <div class="kartu" id="kepala">
    <div class="langkah" id="langkah"></div>
    <div id="isi"></div>
  </div>
  <p class="catatan" style="text-align:center">Kemajuan tersimpan di perangkat ini. Bila halaman tertutup, buka lagi <b>Simulasi Hari H</b> untuk melanjutkan.</p>
</main>
<script src="konfigurasi.js?v=2"></script>
<script src="tka.js?v=16"></script>
<script src="bank/daftar.js?v=6"></script>
<script src="bank/latihan.js?v=3"></script>
<script>
const $ = id => document.getElementById(id), esc = TKA.esc, KUNCI = 'tka-harih', JEDA = 15;
const SET = { 1: ['sd-bi-1', 'sd-mat-1'], 2: ['sd-bi-2', 'sd-mat-2'] };
const info = id => PAKET_TKA.find(p => p.id === id) || { mapel: id, paket: '', soal: 30, durasi: 75 };
const st = () => TKA.simpan.get(KUNCI, null), simpanSt = v => TKA.simpan.set(KUNCI, v);
const r = id => TKA.riwayat.ambil(id);
function predikat(v) { return v >= 85 ? ['Sangat baik', 'p4'] : v >= 70 ? ['Baik', 'p3'] : v >= 55 ? ['Cukup', 'p2'] : ['Perlu bimbingan', 'p1']; }
const tautanSesi = id => 'ujian.html?paket=' + encodeURIComponent(id) + '&harih=1';
let detak = null;

function langkah(i) {
  const L = ['Persiapan', 'Sesi 1', 'Istirahat', 'Sesi 2', 'Hasil'];
  $('langkah').innerHTML = L.map((t, k) => '<div class="' + (k < i ? 'ok' : k === i ? 'kini' : '') + '"><b>' + (k < i ? '✓' : k + 1) + '</b>' + t + '</div>').join('');
}

function gambar() {
  clearInterval(detak);
  const s = st();
  if (!s || !s.urut) return halPilih();
  const [p1, p2] = s.urut, h = s.hasil || {};
  if (!h[p1]) return halSesi(s, 0);
  if (!h[p2]) return s.mulaiSesi2 ? halSesi(s, 1) : halJeda(s);
  return halRekap(s);
}

function halPilih() {
  langkah(0);
  const ada = PAKET_TKA.map(p => p.id);
  const opsi = Object.entries(SET).filter(([, ps]) => ps.every(id => ada.includes(id)));
  $('isi').innerHTML = '<h1>🗓️ Simulasi Hari H</h1><p class="sub">Berlatih seperti hari TKA: dua mata pelajaran berturut-turut, dengan waktu dan aturan yang sama. Nilai baru ditampilkan setelah <b>kedua sesi selesai</b>, seperti pada TKA sebenarnya.</p>' +
    '<h2>Susunan acara</h2><div class="jadwal">' +
    '<div><span>📖</span><span><b>Sesi 1 · Bahasa Indonesia</b><small>30 soal · 75 menit</small></span></div>' +
    '<div><span>☕</span><span><b>Istirahat</b><small>' + JEDA + ' menit (boleh lebih singkat)</small></span></div>' +
    '<div><span>➗</span><span><b>Sesi 2 · Matematika</b><small>30 soal · 75 menit</small></span></div>' +
    '<div><span>🏆</span><span><b>Hasil gabungan</b><small>Nilai kedua mapel dan materi yang perlu dilatih</small></span></div></div>' +
    '<h2>Pilih paket soal</h2><div class="pilih">' + opsi.map(([k], i) => '<label><input type="radio" name="set" value="' + k + '"' + (i === 0 ? ' checked' : '') + '><span><b>Paket ' + k + '</b><small>Bahasa Indonesia ' + info(SET[k][0]).paket + ' + Matematika ' + info(SET[k][1]).paket + '</small></span></label>').join('') + '</div>' +
    '<h2>Sebelum mulai</h2><div class="cek">' +
    ['Saya punya waktu sekitar <b>3 jam</b> tanpa gangguan.', 'Baterai HP/laptop cukup dan internet stabil.', 'Kertas coretan dan alat tulis sudah siap.', 'Saya akan mengerjakan sendiri, tanpa bertanya atau mencari jawaban.']
      .map((t, i) => '<label><input type="checkbox" class="siap" id="siap' + i + '"> <span>' + t + '</span></label>').join('') + '</div>' +
    '<button class="btn kuning" id="b-mulai" type="button" disabled>▶ Mulai Sesi 1: Bahasa Indonesia</button>' +
    '<p class="catatan" style="margin-top:10px">Tidak sempat sekaligus? Sesi 2 boleh dikerjakan di lain waktu; kemajuan tersimpan di perangkat ini.</p>';
  const cek = () => { $('b-mulai').disabled = ![...document.querySelectorAll('.siap')].every(x => x.checked); };
  document.querySelectorAll('.siap').forEach(x => x.onchange = cek);
  $('b-mulai').onclick = () => {
    const k = (document.querySelector('input[name=set]:checked') || {}).value || '1';
    simpanSt({ set: +k, urut: SET[k], mulai: Date.now(), hasil: {} });
    location.href = tautanSesi(SET[k][0]);
  };
}

function halSesi(s, k) {
  langkah(k === 0 ? 1 : 3);
  const id = s.urut[k], p = info(id), lokal = TKA.simpan.get('tka-sesi-' + id, null);
  $('isi').innerHTML = '<h1>' + (k === 0 ? '📖' : '➗') + ' Sesi ' + (k + 1) + ': ' + esc(p.mapel) + '</h1><p class="sub">' + esc(p.mapel + ' · ' + p.paket) + ' · ' + p.soal + ' soal · ' + p.durasi + ' menit.</p>' +
    (lokal ? '<div class="tips">⏳ Sesi ini <b>sedang berlangsung</b>. Waktu terus berjalan walaupun halaman ditutup. Lanjutkan sekarang.</div>' : '') +
    '<div class="tips"><b>Ingat:</b><ul><li>Baca teks dan soal dengan teliti.</li><li>Tandai <b>Ragu-ragu</b> bila belum yakin, lalu periksa lewat Daftar Soal.</li><li>Gunakan waktu sebaik mungkin; jawaban terkirim otomatis bila waktu habis.</li></ul></div>' +
    '<div class="baris"><a class="btn kuning" href="' + tautanSesi(id) + '">' + (lokal ? '⏳ Lanjutkan Sesi ' + (k + 1) : '▶ Mulai Sesi ' + (k + 1)) + '</a><button class="btn ghost kecil" type="button" id="b-batal">Batalkan Simulasi Hari H</button></div>';
  $('b-batal').onclick = batal;
}

function halJeda(s) {
  langkah(2);
  const akhir = (s.jedaMulai || Date.now()) + JEDA * 60000;
  $('isi').innerHTML = '<h1>☕ Istirahat</h1><p class="sub">Sesi 1 selesai dan jawabanmu sudah tersimpan. Nilainya akan ditampilkan setelah Sesi 2, seperti pada TKA.</p>' +
    '<div class="waktu" id="hitung">' + JEDA + ':00</div><p class="sub" style="text-align:center" id="hitung-ket">menuju Sesi 2</p>' +
    '<div class="tips"><b>Selama istirahat:</b><ul><li>Minum air putih dan makan camilan ringan.</li><li>Berdiri dan regangkan badan, istirahatkan mata dari layar.</li><li>Lupakan soal Sesi 1; fokus pada sesi berikutnya.</li><li>Siapkan kertas coretan baru untuk Matematika.</li></ul></div>' +
    '<div class="baris"><button class="btn kuning" id="b-sesi2" type="button">▶ Mulai Sesi 2: Matematika</button><button class="btn ghost kecil" type="button" id="b-batal">Batalkan</button></div>' +
    '<p class="catatan">Boleh mulai sebelum waktu istirahat habis.</p>';
  const jalan = () => { const sisa = Math.max(0, akhir - Date.now()), m = Math.floor(sisa / 60000), d = Math.floor(sisa % 60000 / 1000);
    $('hitung').textContent = m + ':' + String(d).padStart(2, '0'); if (!sisa) { $('hitung-ket').textContent = 'Waktu istirahat selesai. Ayo mulai Sesi 2!'; clearInterval(detak); } };
  jalan(); detak = setInterval(jalan, 1000);
  $('b-sesi2').onclick = () => { const v = st(); v.mulaiSesi2 = Date.now(); simpanSt(v); location.href = tautanSesi(v.urut[1]); };
  $('b-batal').onclick = batal;
}

async function pastikanNilai(rr) {
  if (!rr || !rr.tertunda) return rr;
  const kode = TKA.kode.get();
  const res = await TKA.api({ aksi: 'nilai', paket: rr.paket, jawaban: rr.jawaban, peserta: rr.peserta, kode: kode && kode.kode });
  if (res.ok) { Object.assign(rr, { nilai: res.nilai, terjawab: res.terjawab, jumlah: res.jumlah, tertunda: false, saran: res.saran || [] }); TKA.riwayat.simpan(rr); }
  return rr;
}

async function halRekap(s) {
  langkah(5);
  $('isi').innerHTML = '<div style="text-align:center;padding:30px 0">⏳ Menyiapkan hasil…</div>';
  const hasil = [];
  for (const id of s.urut) hasil.push({ id, p: info(id), r: await pastikanNilai(r(s.hasil[id])) });
  const ada = hasil.filter(x => x.r && typeof x.r.nilai === 'number' && !x.r.tertunda);
  const rata = ada.length === 2 ? Math.round((ada[0].r.nilai + ada[1].r.nilai) / 2 * 10) / 10 : null;
  const lama = s.selesai && s.mulai ? Math.round((s.selesai - s.mulai) / 60000) : null;
  const lat = typeof LATIHAN_TKA === 'undefined' ? [] : LATIHAN_TKA;
  const per = hasil.map(x => ((x.r && x.r.saran) || []).map(id => lat.find(l => l.id === id)).filter(Boolean));
  const saran = []; for (let i = 0; i < Math.max(0, ...per.map(a => a.length)); i++) per.forEach(a => { if (a[i]) saran.push(a[i]); });   // selang-seling kedua mapel
  const kotak = x => { const ok = x.r && typeof x.r.nilai === 'number' && !x.r.tertunda; const [pl, pc] = ok ? predikat(x.r.nilai) : ['', ''];
    return '<div><small>' + esc(x.p.mapel) + '</small><b>' + (ok ? TKA.angka(x.r.nilai) : '–') + '</b>' + (ok ? '<span class="pred ' + pc + '">' + pl + '</span><br><small>' + x.r.terjawab + ' dari ' + x.r.jumlah + ' soal dijawab</small>' : '<small>Nilai belum dapat dihitung. Periksa internet lalu muat ulang halaman ini.</small>') + '</div>'; };
  const [rpl, rpc] = rata !== null ? predikat(rata) : ['', ''];
  $('isi').innerHTML = '<h1>🏆 Hasil Simulasi Hari H</h1><p class="sub">Paket ' + s.set + (lama ? ' · total waktu ' + Math.floor(lama / 60) + ' jam ' + (lama % 60) + ' menit (termasuk istirahat)' : '') + '</p>' +
    '<div class="nilai">' + hasil.map(kotak).join('') + '<div><small>Rata-rata</small><b>' + (rata !== null ? TKA.angka(rata) : '–') + '</b>' + (rata !== null ? '<span class="pred ' + rpc + '">' + rpl + '</span>' : '') + '</div></div>' +
    (rata !== null ? '<p>' + (rata >= 85 ? '🎉 Luar biasa! Kamu siap menghadapi TKA. Pertahankan dengan berlatih rutin.' : rata >= 70 ? '👍 Bagus! Sedikit lagi. Latih materi di bawah agar nilaimu makin mantap.' : rata >= 55 ? '💪 Cukup. Fokus pada materi di bawah, lalu ulangi Simulasi Hari H dengan paket lain.' : '📚 Masih perlu banyak latihan. Mulai dari materi di bawah, sedikit demi sedikit setiap hari.') + '</p>' : '') +
    (saran.length ? '<div class="saran"><h2>📌 Materi yang perlu dilatih</h2><p class="sub" style="margin:0 0 4px">Berdasarkan soal yang belum benar di kedua sesi. Setiap latihan 5 soal.</p>' + saran.slice(0, 8).map((l, i) => '<a href="ujian.html?paket=' + l.id + '"><b style="background:#d97706;color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none">' + (i + 1) + '</b><span style="flex:1"><b>' + esc(l.judul) + '</b><br><small class="catatan">' + esc(l.mapel) + '</small></span>›</a>').join('') + (saran.length > 8 ? '<p class="catatan">… dan ' + (saran.length - 8) + ' latihan lain. Mulailah dari yang paling atas.</p>' : '') + '</div>' : '') +
    '<h2 style="margin-top:14px">📄 Hasil tiap sesi</h2><div class="baris">' + hasil.map((x, i) => x.r ? '<a class="btn ghost kecil" href="ujian.html?paket=' + encodeURIComponent(x.id) + '&lihat=' + encodeURIComponent(x.r.id) + '">Sesi ' + (i + 1) + ': ' + esc(x.p.mapel) + '</a>' : '').join('') + '</div>' +
    '<div class="baris"><button class="btn kuning" type="button" id="b-lagi">🔁 Simulasi Hari H lagi</button>' + (rata !== null ? '<a class="btn wa" id="b-wa" target="_blank" rel="noopener">💬 Bagikan ke WA</a>' : '') + '<a class="btn ghost" href="./#riwayat">📈 Grafik perkembanganku</a></div>';
  $('b-lagi').onclick = () => { if (confirm('Mulai Simulasi Hari H baru? Hasil ini tetap tersimpan di riwayat.')) { TKA.simpan.hapus(KUNCI); gambar(); } };
  if ($('b-wa')) $('b-wa').href = 'https://wa.me/?text=' + encodeURIComponent('Hasil Simulasi Hari H TKA SD (Paket ' + s.set + '):\n' + ada.map(x => '• ' + x.p.mapel + ': ' + TKA.angka(x.r.nilai)).join('\n') + '\n• Rata-rata: ' + TKA.angka(rata) + '\n\nCoba juga: ' + new URL('hari-h.html', location.href).href);
}

function batal() {
  if (!confirm('Batalkan Simulasi Hari H? Sesi yang sudah dikerjakan tetap tersimpan di riwayat.')) return;
  TKA.simpan.hapus(KUNCI); gambar();
}
gambar();
</script>
</body>
</html>

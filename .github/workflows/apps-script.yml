# Memasang tka/server/Code.gs dan Kunci.gs (didekripsi dari Kunci.gs.enc) ke Google Apps Script
# server Simulasi TKA, lalu memperbarui deployment aplikasi web yang sama (URL tidak berubah).
#
# Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON       isi berkas ~/.clasprc.json hasil `clasp login` akun Google pemilik Apps Script
#   KUNCI_PRIVATE_KEY  kunci privat untuk membuka Kunci.gs.enc
# Variable yang dibutuhkan (tab Variables):
#   TKA_SCRIPT_ID      ID skrip (Apps Script → Setelan proyek → ID Skrip)
name: Pasang server Simulasi TKA

on:
  push:
    branches: [main]
    paths:
      - 'tka/server/Code.gs'
      - 'tka/server/Kunci.gs.enc'
      - 'tka/server/Kunci.gs.key.enc'
      - 'tka/konfigurasi.js'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pasang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Periksa pengaturan
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          KUNCI_PRIVATE_KEY: ${{ secrets.KUNCI_PRIVATE_KEY }}
          SCRIPT_ID: ${{ vars.TKA_SCRIPT_ID }}
        run: |
          kurang=""
          [ -n "$CLASPRC_JSON" ] || kurang="$kurang secret:CLASPRC_JSON"
          [ -n "$KUNCI_PRIVATE_KEY" ] || kurang="$kurang secret:KUNCI_PRIVATE_KEY"
          [ -n "$SCRIPT_ID" ] || kurang="$kurang variable:TKA_SCRIPT_ID"
          if [ -n "$kurang" ]; then echo "::error::Pengaturan belum lengkap:$kurang"; exit 1; fi

      - name: Siapkan clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@2.4.2
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Ambil proyek Apps Script
        env:
          SCRIPT_ID: ${{ vars.TKA_SCRIPT_ID }}
        run: |
          mkdir proyek && cd proyek
          clasp clone "$SCRIPT_ID"
          ls -la

      - name: Buka Kunci.gs dan salin kode terbaru
        env:
          KUNCI_PRIVATE_KEY: ${{ secrets.KUNCI_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KUNCI_PRIVATE_KEY" > "$RUNNER_TEMP/privat.pem"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/privat.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in tka/server/Kunci.gs.key.enc -out "$RUNNER_TEMP/sandi"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tka/server/Kunci.gs.enc -out proyek/Kunci.js -pass file:"$RUNNER_TEMP/sandi"
          rm -f "$RUNNER_TEMP/privat.pem" "$RUNNER_TEMP/sandi"
          cp tka/server/Code.gs proyek/Code.js
          # Penanda versi = sidik isi kode + kunci. Loket cadangan hanya dipakai peramban bila versinya sama persis
          # dengan loket utama; pemasangan ulang tanpa perubahan isi tidak membuat loket cadangan tertinggal.
          VERSI=$(cat tka/server/Code.gs proyek/Kunci.js | sha256sum | cut -c1-12)
          printf "var VERSI_PASANG = '%s';\n" "$VERSI" > proyek/Versi.js
          echo "Versi isi: $VERSI"
          grep -q "var KUNCI_TKA" proyek/Kunci.js || { echo "::error::Kunci.js tidak valid"; exit 1; }

      - name: Unggah kode ke Apps Script
        working-directory: proyek
        run: clasp push --force

      - name: Perbarui deployment aplikasi web (URL tetap)
        working-directory: proyek
        run: |
          DEPLOY_ID=$(grep "const TKA_API" ../tka/konfigurasi.js | grep -o "macros/s/[^/]*" | cut -d/ -f3)
          [ -n "$DEPLOY_ID" ] || { echo "::error::URL server tidak ditemukan di tka/konfigurasi.js"; exit 1; }
          clasp deploy --deploymentId "$DEPLOY_ID" --description "Otomatis dari GitHub ${GITHUB_SHA::7}" | tee "$RUNNER_TEMP/deploy.txt"
          VERSI=$(grep -o "@[0-9]*" "$RUNNER_TEMP/deploy.txt" | tail -1 | tr -d @)
          echo "VERSI_SKRIP=$VERSI" >> "$GITHUB_ENV"

      # Loket cadangan (opsional): deployment milik akun Google lain dari proyek yang sama. Bila kredensial akun itu
      # disimpan sebagai secret CLASPRC_JSON_LOKET2 / CLASPRC_JSON_LOKET3, deployment-nya ikut diperbarui ke versi yang sama.
      # Bila tidak ada, loket itu tertinggal versi dan otomatis tidak dipakai peramban sampai diperbarui (aman).
      - name: Perbarui loket cadangan (bila kredensial tersedia)
        if: env.VERSI_SKRIP != ''
        continue-on-error: true
        working-directory: proyek
        env:
          LOKET2: ${{ secrets.CLASPRC_JSON_LOKET2 }}
          LOKET3: ${{ secrets.CLASPRC_JSON_LOKET3 }}
        run: |
          IDS=$(sed -n '/TKA_LOKET_CADANGAN/,/\]/p' ../tka/konfigurasi.js | grep -o "macros/s/[^/]*" | cut -d/ -f3)
          n=2
          for ID in $IDS; do
            CRED=$( [ "$n" = 2 ] && printf '%s' "$LOKET2" || printf '%s' "$LOKET3" )
            if [ -n "$CRED" ]; then
              umask 077; printf '%s' "$CRED" > ~/.clasprc.json
              clasp deploy --deploymentId "$ID" --versionNumber "$VERSI_SKRIP" --description "Loket $n otomatis ${GITHUB_SHA::7}" \
                && echo "Loket $n diperbarui ke versi $VERSI_SKRIP" || echo "::warning::Loket $n gagal diperbarui"
            else
              echo "::notice::Loket $n belum punya kredensial otomatis; perbarui manual dari akun pemiliknya (Kelola deployment → Edit → Versi baru)."
            fi
            n=$((n+1))
          done
          rm -f ~/.clasprc.json

      - name: Uji server
        run: |
          URL=$(grep "const TKA_API" tka/konfigurasi.js | grep -o "https://script.google.com/macros/s/[^']*")
          for i in 1 2 3; do
            HASIL=$(curl -sSL "$URL?aksi=statistik" || true)
            echo "Statistik: $HASIL"
            echo "$HASIL" | grep -q '"ok":true' && exit 0
            sleep 10
          done
          echo "::error::Server tidak menjawab dengan benar setelah dipasang"; exit 1

      - name: Periksa versi loket cadangan
        if: always()
        run: |
          UTAMA=$(curl -sSL "$(grep "const TKA_API" tka/konfigurasi.js | grep -o "https://script.google.com/macros/s/[^']*")?aksi=loket" || true)
          echo "Loket 1 (utama): $UTAMA"
          n=2
          for URL in $(sed -n '/TKA_LOKET_CADANGAN/,/\]/p' tka/konfigurasi.js | grep -o "https://script.google.com/macros/s/[^']*"); do
            H=$(curl -sSL "$URL?aksi=loket" || true); echo "Loket $n: $H"
            [ "$(echo "$H" | grep -o '"versi":"[^"]*"')" = "$(echo "$UTAMA" | grep -o '"versi":"[^"]*"')" ] \
              || echo "::warning::Loket $n belum sama versinya dengan loket utama, jadi belum dipakai siswa."
            n=$((n+1))
          done

      - name: Bersihkan kredensial
        if: always()
        run: rm -f ~/.clasprc.json proyek/Kunci.js
